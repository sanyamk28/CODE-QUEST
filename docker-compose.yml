version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pf-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-placementforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pf-network

  redis:
    image: redis:7-alpine
    container_name: pf-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pf-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pf-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENV_MODE=${ENV_MODE:-development}
      - SECRET_KEY=${SECRET_KEY:-devsecretjwtkeyplacementforge123456789}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-300}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
      - POSTGRES_DB=${POSTGRES_DB:-placementforge}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - SANDBOX_HOST=sandbox-executor
      - SANDBOX_PORT=8080
      - SANDBOX_SECRET_TOKEN=${SANDBOX_SECRET_TOKEN:-devsandboxsecrettoken}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FCM_SERVER_KEY=${FCM_SERVER_KEY}
    depends_on:
      - postgres
      - redis
      - sandbox-executor
    networks:
      - pf-network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pf-worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    restart: always
    environment:
      - ENV_MODE=${ENV_MODE:-development}
      - SECRET_KEY=${SECRET_KEY:-devsecretjwtkeyplacementforge123456789}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-300}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
      - POSTGRES_DB=${POSTGRES_DB:-placementforge}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - SANDBOX_HOST=sandbox-executor
      - SANDBOX_PORT=8080
      - SANDBOX_SECRET_TOKEN=${SANDBOX_SECRET_TOKEN:-devsandboxsecrettoken}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FCM_SERVER_KEY=${FCM_SERVER_KEY}
    depends_on:
      - redis
      - postgres
    networks:
      - pf-network

  sandbox-executor:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: pf-sandbox-executor
    restart: always
    environment:
      - SANDBOX_SECRET_TOKEN=${SANDBOX_SECRET_TOKEN:-devsandboxsecrettoken}
    ports:
      - "8080:8080"
    # CPU/Memory limits can be specified for resource containment
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - pf-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: pf-admin
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pf-network

networks:
  pf-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
